<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LogiLED</title><style>:root{--font:system-ui,-apple-system,"Segoe UI","Roboto","Ubuntu","Cantarell","Noto Sans",sans-serif;--bg:#11191f;--fg:hsl(205,16%,77%);--heading:#e1e6eb;--muted:hsl(205,10%,50%);--border:#1f2d38;--card:#2b3439;--primary:hsl(195,85%,41%);--space:1rem;--vertical:2rem;--size:16px}*,:after,:before{box-sizing:border-box;background-repeat:no-repeat}html{background:var(--bg);color:var(--fg);font:400 var(--size)/1.5 var(--font);text-rendering:optimizeLegibility}body{width:100%;min-height:100vh;margin:0;background:var(--bg);color:var(--fg);display:flex;flex-direction:column}body>header,body>main,body>footer{width:100%;margin:0 auto;padding:var(--vertical) 0}.container{width:100%;max-width:510px;margin:0 auto;padding-left:var(--space);padding-right:var(--space)}@media(min-width:576px){:root{--size:17px}body>header,body>main,body>footer{--vertical:2.5rem}.container{max-width:700px;padding-left:0;padding-right:0}}@media(min-width:768px){:root{--size:18px}body>header,body>main,body>footer{--vertical:3rem}.container{max-width:920px}}@media(min-width:992px){:root{--size:19px}body>header,body>main,body>footer{--vertical:3.5rem}.container{max-width:920px}}@media(min-width:1200px){:root{--size:20px}body>header,body>main,body>footer{--vertical:4rem}.container{max-width:1130px}}header{padding-bottom:0!important}header .head{display:grid;grid-template-columns:90px minmax(0,1fr);gap:1rem}.device{grid-column:1;text-align:right;font-size:.75rem;font-weight:600;color:var(--heading);white-space:nowrap}.icons{display:flex;gap:.7rem;color:var(--muted);white-space:nowrap}.icons svg{width:1rem;height:1rem;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.power svg{width:1.25rem;height:1.25rem;fill:none;stroke:var(--primary);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}main{flex:1;padding-top:1.5rem!important}.main-grid{display:grid;grid-template-columns:90px minmax(0,1fr);gap:1rem}.sidebar{min-width:0}.nav{display:flex;flex-direction:column;gap:.55rem;margin:0;padding:0;list-style:none}.nav a{display:block;color:var(--heading);font-size:.75rem;line-height:1.5;text-decoration:none;white-space:nowrap}.nav a:first-child{color:var(--primary)}.nav i{display:inline-block;width:1.1rem;margin-right:.15rem;text-align:center;font-style:normal;font-size:.9rem}.content{min-width:0}.output{min-height:62px;margin:0;padding:.5rem;background:var(--card);border:0;border-radius:.25rem;display:flex;align-items:center}.output-title{align-self:center;flex:none;width:4.3rem;padding:.1rem 0 0 .15rem;color:#fff;font-size:.75rem;line-height:1.4}.measurements{display:flex;flex-wrap:nowrap;gap:.25rem;align-items:center;overflow:hidden;flex:1;margin:0}.pill{display:inline-block;border:1px solid #9aa8b0;border-radius:999px;padding:.05rem .45rem;color:#c8d1d8;font-size:.625rem;line-height:1.5;white-space:nowrap}.pill.hidden{display:none}.power{margin-left:auto;width:2.25rem;height:2.25rem;border:4px solid var(--primary);border-radius:50%;display:grid;place-items:center;flex:none;color:var(--primary);font-size:1.2rem;font-weight:600;background:#f5f7f8}.foot{padding-left:108px;color:var(--heading);font-size:.6rem;line-height:1.5}.foot .sep{color:var(--muted);padding:0 .3rem}.foot a{color:var(--primary);text-decoration:none}@media(max-width:991px){.main-grid{grid-template-columns:1fr}.sidebar{margin-bottom:1rem}.nav{flex-direction:row;flex-wrap:wrap;gap:.75rem}.content{width:100%}}@media(max-width:575px){body>header,body>main,body>footer{--vertical:2rem}.main-grid{gap:.5rem}.output{min-height:70px}.output-title{width:4rem}.measurements{max-width:calc(100vw - 8rem)}.icons{font-size:.85rem;letter-spacing:.15rem}.foot{font-size:.55rem}}</style></head><body><header><div class="container head"><strong class="device" id="device">PlugS Gen3 - Test</strong></div></header><main><div class="container main-grid"><aside class="sidebar"><nav class="nav"><a href="#"><i>⌂</i>LogiLED</a></nav></aside><section class="content"><div class="output"><div class="output-title">Output (0)</div><div class="measurements"><span class="pill hidden" id="p"></span><span class="pill hidden" id="v"></span><span class="pill hidden" id="i"></span><span class="pill hidden" id="f"></span><span class="pill hidden" id="e"></span></div><div class="power"><svg viewBox="0 0 24 24"><path d="M12 2v10M6.7 5.3a8 8 0 1 0 10.6 0"/></svg></div></div></section></div></main><footer><div class="container foot"><span id="ft-mac">—</span><span class="sep">|</span><span id="ft-ver">—</span><span class="sep">|</span><span id="ft-build">—</span><span class="sep">|</span><span id="ft-time">—</span><span class="sep">|</span><span>Feedback</span></div></footer><script>function set(i,v){document.getElementById(i).textContent=v}function measure(i,v,u){var el=document.getElementById(i),visible=v!==null&&v!==undefined&&Number(v)!==0;el.textContent=visible?String(v)+' '+u:'';el.classList.toggle('hidden',!visible)}function footer(d,sys){var now=sys&&sys.unixtime?new Date(sys.unixtime*1000):new Date();var ts=now.toLocaleString('en-GB').replace(',','');var build=d.build_id==null?'—':String(d.build_id).split('-').pop();set('ft-mac',(d.mac||'—').replace(/:/g,''));set('ft-ver',d.ver||'—');set('ft-build',build);set('ft-time',ts)}function poll(){fetch('/rpc/Switch.GetStatus?id=0').then(function(r){return r.json()}).then(function(s){measure('p',s.apower,'W');measure('v',s.voltage,'V');measure('i',s.current==null?null:Math.round(s.current*1000),'mA');measure('f',s.freq,'Hz');measure('e',s.aenergy&&s.aenergy.total!=null?(Number(s.apower)<0?'← ':'→ ')+s.aenergy.total:null,'Wh')}).catch(function(){})}Promise.all([fetch('/rpc/Shelly.GetDeviceInfo').then(function(r){return r.json()}),fetch('/rpc/Sys.GetStatus').then(function(r){return r.json()})]).then(function(a){var d=a[0],sys=a[1];set('device',d.name||d.id||'PlugS Gen3 - Test');footer(d,sys)}).catch(function(){});poll();setInterval(poll,1000);setInterval(function(){fetch('/rpc/Sys.GetStatus').then(function(r){return r.json()}).then(function(sys){var now=sys&&sys.unixtime?new Date(sys.unixtime*1000):new Date();set('ft-time',now.toLocaleString('en-GB').replace(',',''))}).catch(function(){})},1000)</script></body></html>
